<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squirms</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    canvas#canvas { display: block; width: 100%; height: 100%; outline: none; }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    // Emscripten only wires up Module.canvas automatically when it generates
    // its own shell.html; since this is a hand-written page, point it at the
    // canvas ourselves before the generated glue script runs.
    var Module = { canvas: document.getElementById('canvas') };
  </script>
  <script src="squirms_wasm.js"></script>
</body>
</html>
